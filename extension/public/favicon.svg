<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="ToneLoom">
  <rect width="128" height="128" rx="28" fill="#FBFBFA"/>

  <g transform="translate(64 64)">
    <g style="isolation:isolate">
      <!-- Deep Inkwell loop — lower-left of the diamond weave -->
      <rect
        x="-29" y="-29" width="58" height="58" rx="13"
        transform="rotate(45) translate(-5.5 5.5)"
        fill="none"
        stroke="#1B4D3E"
        stroke-width="7.5"
        stroke-linejoin="round"
      />
      <!-- Resonant Gold loop — upper-right; multiply blend where ribbons overlap -->
      <rect
        x="-29" y="-29" width="58" height="58" rx="13"
        transform="rotate(45) translate(5.5 -5.5)"
        fill="none"
        stroke="#E9B824"
        stroke-width="7.5"
        stroke-linejoin="round"
        style="mix-blend-mode:multiply"
      />
    </g>

    <!-- Accent dots in the interior pockets -->
    <circle cx="0" cy="-20" r="3.4" fill="#1B4D3E"/>
    <circle cx="0" cy="20" r="3.4" fill="#E9B824"/>
  </g>
</svg>
