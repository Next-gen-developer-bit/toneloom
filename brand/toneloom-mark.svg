<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="ToneLoom">
  <!-- Canvas -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#FBFBFA"/>

  <g transform="translate(64 64)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Diamond frame -->
    <rect
      x="-36" y="-36" width="72" height="72" rx="11"
      transform="rotate(45)"
      fill="#FBFBFA"
      stroke="#1B4D3E"
      stroke-width="5.5"
    />

    <!-- Interconnected overlapping ribbons (woven wave) -->
    <!-- Deep Inkwell ribbon -->
    <path
      d="M-22 -10 C-8 -24 8 -24 22 -10 C10 0 -10 0 -22 -10"
      fill="none"
      stroke="#1B4D3E"
      stroke-opacity="0.92"
      stroke-width="6"
    />
    <path
      d="M-24 2 C-8 -12 8 -12 24 2 C10 12 -10 12 -24 2"
      fill="none"
      stroke="#1B4D3E"
      stroke-opacity="0.55"
      stroke-width="5"
    />

    <!-- Resonant Gold ribbon — overlaps inkwell -->
    <path
      d="M-22 0 C-6 14 6 14 22 0 C8 -10 -8 -10 -22 0"
      fill="none"
      stroke="#E9B824"
      stroke-opacity="0.88"
      stroke-width="6"
    />
    <path
      d="M-20 12 C-6 24 6 24 20 12"
      fill="none"
      stroke="#E9B824"
      stroke-opacity="0.7"
      stroke-width="5"
    />

    <!-- Accent dots (top & bottom interior) -->
    <circle cx="0" cy="-22" r="3.4" fill="#E9B824"/>
    <circle cx="0" cy="22" r="3.4" fill="#1B4D3E"/>
  </g>
</svg>
